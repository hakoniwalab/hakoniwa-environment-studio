# Workspace Recipe (hakoniwa-business-pack format; private to this repository).
# It declares what the CityGML parts converter needs and lets
# hakoniwa-business-pack/tools/recipe.py materialize and check it:
#   python ../hakoniwa-business-pack/tools/recipe.py plan --recipe hakoniwa/recipes/citygml-parts.yaml
id: citygml-parts
title: CityGML (PLATEAU / OpenStreetMap) to editable Environment Studio parts
recipe_version: 0.1

goal:
  user_request: 地図や PLATEAU の街を、Environment Studio で部品単位に編集できる試験環境にしたい
  description: >
    CityGML is the shared intermediate representation for city data.
    hakoniwa-envsim reads and writes it (PLATEAU EPSG:6697, and EPSG:4326
    converted from OpenStreetMap / GeoJSON by osm2citygml.py); this
    repository's parts converter (tools/env_citygml.py) turns each
    bldg:Building into one building-footprint part and each LOD1 road surface
    into a road-area part, keeping gml:id and provenance, and the Studio
    edits, validates (MuJoCo) and generates the result.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-envsim owns CityGML extraction (gml_lod1_extract, road_terrain_probe) and OSM to CityGML conversion.
    - Environment Studio owns the Type / Catalog / Recipe contract, MuJoCo validation and GLB / MJCF generation.

validation:
  status: partially_verified
  summary: >
    On macOS, OpenStreetMap around Tokyo Station (300 m) went through
    osm2citygml, the parts converter and MuJoCo validation with no problem;
    Envsim's PLATEAU fixtures convert to parts. PLATEAU downloads through the
    Studio UI and LOD2 parts (stage B) are not done yet.

foundation_contract:
  mode: not_required
  reason: The conversion uses Python tools of Envsim and this repository; it does not start Hakoniwa Core.

recipe_local_requirements_schema_version: 1
recipe_local_requirements:
  hakoniwa-envsim:
    root:
      default_path: ../hakoniwa-envsim
      override_env: HAKONIWA_ENVSIM_ROOT
      relative_to: recipe_repository
    source:
      type: git
      url: https://github.com/hakoniwalab/hakoniwa-envsim.git
      revision: main
    required_artifacts:
      - path: src/city_pipeline/geodesy.py
        kind: file
      - path: src/city_pipeline/gml_lod1_extract.py
        kind: file
      - path: src/city_pipeline/road_terrain_probe.py
        kind: file
      - path: src/city_pipeline/osm2citygml.py
        kind: file
      - path: tools/hako.py
        kind: file

runtime_dependencies:
  python:
    requirements: requirements.txt

components:
  - id: hakoniwa-envsim
    roles: [asset_generator, data_conversion]
    purpose: Read CityGML (PLATEAU, converted OpenStreetMap) and convert OpenStreetMap / GeoJSON to CityGML LOD1.
  - id: hakoniwa-environment-studio
    roles: [authoring, validation]
    purpose: Turn CityGML into editable parts, edit them in the browser, validate with MuJoCo, generate GLB / MJCF.

data_flow:
  - OpenStreetMap (Overpass) or GeoJSON -> envsim osm2citygml.py -> CityGML LOD1 (EPSG:4326) with OSM provenance
  - PLATEAU CityGML (EPSG:6697, via envsim hako.py) or the CityGML above -> tools/env_citygml.py -> Environment Recipe of parts
  - Environment Recipe -> Studio edit -> MuJoCo validation -> environment.glb / environment.xml

demo:
  steps:
    - python ../hakoniwa-business-pack/tools/recipe.py plan --recipe hakoniwa/recipes/citygml-parts.yaml
    - python -m venv .venv && .venv/bin/pip install -r requirements.txt
    - .venv/bin/python ../hakoniwa-envsim/src/city_pipeline/osm2citygml.py --bbox 35.6795,139.7650,35.6822,139.7683 --overpass --out-dir work/map-data/tokyo
    - .venv/bin/python tools/env_citygml.py --citygml work/map-data/tokyo --center 35.68085,139.76665 --half-extent 149.787,149.367 --out work/recipes/tokyo.yaml
    - .venv/bin/python tools/env_studio.py start

# CC0 scenery normalized to metres for CARLA Town04-like roadside layouts.
# Every visual is centered in plan and stands with its base at z=0. Placement
# width/depth/height scale the visual and its simple collider together.
schema: hakoniwa.environment-catalog/v1
catalog:
  id: scenery-cc0
  name: CC0 roadside scenery
  description: Buildings, vegetation and roadside furniture suited to CARLA Town04 bounds.
  includes: [../starter/catalog.yaml]

items:
  - id: cc0-pine-tall
    type: scenery_cylinder
    name: Pine tree (tall)
    category: CC0 vegetation
    params: {visual: assets/pine-tall.glb, native_width_m: 7.5, native_depth_m: 7.5, native_height_m: 12.0,
             width_m: 7.5, depth_m: 7.5, height_m: 12.0}
    source: {site: Kenney, original_asset: tree_pineTallA, pack: Nature Kit,
             url: "https://kenney.nl/assets/nature-kit", license: CC0, author: Kenney, polygons: 78}

  - id: cc0-oak

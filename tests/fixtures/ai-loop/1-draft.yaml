# Round 1: an agent's first Recipe for request.txt. Schema mistakes an agent
# typically makes: a field name guessed (yaw instead of yaw_deg), a value out
# of range, an item that is not in the Catalog.
schema: hakoniwa.environment-recipe/v1
name: ドローン練習場
catalog: ../../../catalogs/starter/catalog.yaml
size_m: {east: 20, north: 30}
terrain: {item: grass-ground}
objects:
  - {id: gate-1, item: race-gate, pose: {x_m: 0, y_m: -6, yaw: 0}}
  - {id: gate-2, item: race-gate, pose: {x_m: 0, y_m: 0, yaw_deg: 0}, params: {opening_width_m: 30}}
  - {id: gate-3, item: race-gate, pose: {x_m: 0, y_m: 6, yaw_deg: 0}}
  - {id: pad, item: helipad, pose: {x_m: 9, y_m: 14, yaw_deg: 0}}
